81\u548C\u513F\u7AE5\u4E0D\u5C5E\u4E8E\u672C\u7CFB\u5217\u8303\u56F4\u3002","Decompress immediately once diagnosed; a pulse does not exclude ACS. Do not delay clear clinical cases for pressure testing. Chronic exertional disease and children are outside this series."),params:[[t("\u538B\u529B\u5DEE","Perfusion difference"),t("\u0394P = \u8212\u5F20\u538B \u2212 \u5BA4\u5185\u538B","\u0394P = diastolic BP \u2212 compartment pressure"),t("BOASt\uFF1A<30 mmHg \u4E3A\u98CE\u9669\u5347\u9AD8\uFF1B>40 mmHg \u7EDD\u5BF9\u5BA4\u5185\u538B\u987B\u8003\u8651\u7D27\u6025\u51CF\u538B\u3002\u7ED3\u5408\u4E34\u5E8A\u3001\u6D4B\u91CF\u8D8B\u52BF\u4E0E\u8D44\u6DF1\u533B\u5E08\u5224\u65AD\uFF0C\u4E0D\u80FD\u5355\u6B21\u8BFB\u6570\u81EA\u52A8\u51B3\u5B9A\u3002","BOASt: <30 mmHg signals increased risk; absolute pressure >40 mmHg warrants consideration of urgent decompression. Interpret clinically with trends and senior review, not as an automatic rule."),"B"],[t("\u91CD\u590D\u6D4B\u538B","Repeated measurements"),t("AAOS\uFF1A\u0394P >30 mmHg","AAOS: \u0394P >30 mmHg"),t("\u91CD\u590D/\u6301\u7EED\u6D4B\u91CF\u53EF\u8F85\u52A9\u6392\u9664\uFF1B\u5355\u6B21\u6B63\u5E38\u503C\u4E0D\u662F\u6392\u9664\u8BC1\u636E\uFF0C\u9608\u503C\u4E0D\u53D6\u4EE3\u4E34\u5E8A\u5224\u65AD\u3002","Repeated/continuous measurements may help rule out ACS; one normal result cannot exclude it or replace clinical judgment."),"A"],[t("\u590D\u8BC4\u4E0E\u521B\u9762\u8BA1\u5212","Reassessment & wound plan"),t("\u6BCF\u5C0F\u65F6 / 24 h / \u226472 h","Hourly / 24 h / \u226472 h"),t("\u9AD8\u98CE\u9669\u8005\u6BCF\u5C0F\u65F6\u8BB0\u5F55\uFF1B\u7B4B\u819C\u5207\u5F00\u540E24\u5C0F\u65F6\u5185\u8BA8\u8BBA\u6574\u5F62\u4FEE\u590D\uFF0C72\u5C0F\u65F6\u5185\u6216\u75C5\u60C5\u9700\u8981\u65F6\u66F4\u65E9\u518D\u63A2\u67E5\u3002","Document at-risk patients hourly; discuss with plastics within 24 h and re-explore within 72 h, earlier if indicated."),"B"],[t("\u5207\u53E3\u957F\u5EA6\u4E0E\u6DF1\u5EA6","Length & depth"),t("\u89E3\u5256\u6807\u5FD7 + \u5B8C\u6574\u51CF\u538B","Landmarks + complete release"),t("\u4E0D\u63D0\u4F9B\u901A\u7528\u56FA\u5B9A\u5398\u7C73\u957F\u5EA6\u6216\u76F2\u5207\u6DF1\u5EA6\u3002\u6240\u6709\u53D7\u7D2F\u5BA4\u987B\u5145\u5206\u51CF\u538B\uFF1B\u4EC5\u5207\u76AE\u80A4\u4E0D\u7B49\u4E8E\u7B4B\u819C\u677E\u89E3\u3002","No universal length or blind cutting depth. Release every involved compartment; a skin incision is not fascial decompression."),"A"]],after:t("\u521B\u9762\u6682\u65F6\u5F00\u653E\uFF1B\u6E05\u521B\u4E0E\u808C\u8089\u6D3B\u6027\u8BB0\u5F55\u540E\uFF0C\u6309\u80BF\u80C0\u548C\u7EC4\u7EC7\u72B6\u6001\u5B89\u6392\u518D\u63A2\u67E5\u53CA\u5EF6\u8FDF\u95ED\u5408/\u8986\u76D6\u3002NPWT \u662F\u53EF\u9009\u521B\u9762\u5904\u7406\uFF0CAAOS\u8BC1\u636E\u5F3A\u5EA6\u4E3A\u6709\u9650\uFF0C\u4E0D\u662F\u7EDF\u4E00\u8D1F\u538B\u5904\u65B9\u3002","Leave wounds temporarily open; document muscle viability and debridement, then plan re-exploration and delayed closure/coverage. NPWT is an option with limited AAOS evidence, not a universal pressure prescription."),late:t("\u8FDF\u53D1\u6216\u6F0F\u8BCA\u5E76\u7591\u4E0D\u53EF\u9006\u635F\u5BB3\uFF1A\u4E0D\u5F97\u6309\u201C\u8D85\u8FC7\u67D0\u5C0F\u65F6\u6570\u201D\u673A\u68B0\u5224\u65AD\u3002\u9700\u8D44\u6DF1\u56E2\u961F\u8BC4\u4F30\u635F\u5BB3\u3001\u80BE\u529F\u80FD\u548C\u624B\u672F\u98CE\u9669\uFF1B\u4E0D\u53EF\u9006\u635F\u5BB3\u65F6\u5E38\u89C4\u7B4B\u819C\u5207\u5F00\u5E76\u975E\u5FC5\u7136\u9002\u7528\u3002","Late/missed ACS with suspected irreversible damage requires senior assessment of tissue injury, renal status and operative risk. Elapsed hours alone are not a decision rule; routine fasciotomy may be inappropriate.")},_={leg:{title:t("\u5C0F\u817F\u56DB\u7B4B\u819C\u5BA4\u5207\u5F00\u51CF\u538B","Four-compartment leg fasciotomy"),tag:t("\u4E3B\u6F14\u793A \xB7 \u53CC\u5207\u53E3","PRIMARY \xB7 TWO INCISIONS"),color:"#237e75",ref:"L",strategy:t("\u53CC\u5207\u53E3\u7528\u4E8E\u663E\u793A\u56DB\u5BA4\u5B8C\u6574\u677E\u89E3\uFF1B\u5355\u5207\u53E3\u5C5E\u4E8E\u6709\u7ECF\u9A8C\u56E2\u961F\u7684\u66FF\u4EE3\u5165\u8DEF\uFF0C\u4E0D\u80FD\u636E\u6B64\u7701\u7565\u6DF1\u540E\u5BA4\u3002","Two incisions demonstrate four-compartment release; experienced teams may use a single incision, but the deep posterior compartment must not be missed."),parts:[t("\u524D\u5BA4","Anterior"),t("\u5916\u4FA7\u5BA4","Lateral"),t("\u6DF1\u540E\u5BA4","Deep posterior"),t("\u6D45\u540E\u5BA4","Superficial posterior")],risks:[t("\u8153\u6D45\u795E\u7ECF\uFF1A\u8FDC\u7AEF\u7A7F\u51FA\u6DF1\u7B4B\u819C\u5904\uFF0C\u4FDD\u62A4\u5176\u5206\u652F\u3002","Superficial fibular nerve: protect distal fascial exit and branches."),t("\u8153\u603B\u795E\u7ECF\uFF1A\u8153\u9AA8\u9888\u5904\uFF0C\u8FD1\u7AEF\u5EF6\u4F38\u9700\u8B66\u60D5\u3002","Common fibular nerve: vulnerable near the fibular neck."),t("\u5927\u9690\u9759\u8109\u4E0E\u9690\u795E\u7ECF\uFF1A\u5185\u4FA7\u76AE\u4E0B\u5C42\u3002","Great saphenous vein and saphenous nerve: medial subcutaneous layer."),t("\u80EB\u540E\u8840\u7BA1\u4E0E\u80EB\u795E\u7ECF\uFF1A\u6DF1\u540E\u5BA4\uFF0C\u8FDC\u7AEF\u66F4\u8868\u6D45\u3002","Posterior tibial vessels and tibial nerve: deep posterior, more superficial distally."),t("\u80EB\u524D\u8840\u7BA1\u4E0E\u8153\u6DF1\u795E\u7ECF\uFF1A\u524D\u5BA4\u6DF1\u9762\u3002","Anterior tibial vessels and deep fibular nerve: deep in the anterior compartment.")],params:[[t("\u524D\u5916\u4FA7\u76AE\u5207\u53E3\u53C2\u7167","Anterolateral landmark"),t("\u8153\u9AA8\u5E72\u524D\u65B9\u7EA6 2 cm","About 2 cm anterior to fibular shaft"),t("AO \u63CF\u8FF0\u503C\uFF1B\u4F9D\u5B9E\u9645\u6807\u5FD7\u8C03\u6574\uFF0C\u5E76\u4FDD\u62A4\u795E\u7ECF\u3002","AO reference, adapted to actual landmarks and nerve anatomy."),"L"],[t("\u540E\u5185\u4FA7\u76AE\u5207\u53E3\u53C2\u7167","Posteromedial landmark"),t("\u80EB\u9AA8\u540E\u5185\u4FA7\u7F18\u540E\u65B9\u7EA6 2 cm","About 2 cm behind posteromedial tibial border"),t("\u4E0D
